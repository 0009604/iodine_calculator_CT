<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CT Contrast Optimizer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Exo+2:wght@300;400;600&display=swap');

        :root {
            --bg: #0a0e12;
            --bg2: #111820;
            --bg3: #1a2535;
            --accent: #00d4aa;
            --accent2: #00a87d;
            --glow: rgba(0,212,170,0.25);
            --text: #e8f0fe;
            --dim: #7a90a8;
            --border: rgba(0,212,170,0.22);
            --card: rgba(26,37,53,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Exo 2', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; display: flex; justify-content: center; min-height: 100vh; }
        .wrapper { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; }

        header { background: var(--bg2); border: 1px solid var(--border); padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        header h1 { font-family: 'Rajdhani', sans-serif; font-size: 24px; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; backdrop-filter: blur(10px); display: none; }
        .card.active { display: flex; flex-direction: column; gap: 15px; }

        .form-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-family: 'Rajdhani', sans-serif; font-size: 15px; color: var(--dim); font-weight: 600; text-transform: uppercase; }
        input, select { background: var(--bg2); border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: var(--text); font-size: 16px; outline: none; transition: all 0.3s; }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 8px var(--glow); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; }
        
        .btn-opt { background: var(--bg3); border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: var(--text); font-weight: 600; cursor: pointer; text-align: center; transition: all 0.2s; font-size: 14px; }
        .btn-opt.selected { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; box-shadow: 0 0 10px var(--glow); }

        .btn-action { background: linear-gradient(135deg, var(--accent2), var(--accent)); color: var(--bg); border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: transform 0.1s, opacity 0.2s; margin-top: 10px; }
        .btn-action:active { transform: scale(0.98); }
        .btn-action:disabled { opacity: 0.4; cursor: not-allowed; }

        .output-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg2); padding: 12px; border-radius: 8px; border-left: 3px solid var(--accent); }
        .output-val { font-family: 'Rajdhani', sans-serif; font-size: 20px; font-weight: 700; color: var(--accent); }

        .biblio-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-top: 10px; }
        .biblio-title { font-family: 'Rajdhani', sans-serif; font-size: 16px; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
        .biblio-item { font-size: 11px; color: var(--dim); margin-bottom: 8px; line-height: 1.4; text-align: justify; }
        .biblio-item strong { color: var(--text); }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>CT Contrast Optimizer</h1>
    </header>

    <div id="step-type" class="card active">
        <label>Seleziona Tipologia Protocollo</label>
        <div class="btn-group">
            <div class="btn-opt" onclick="selezionaTipo('BODY')">BODY (Volume su LBw)</div>
            <div class="btn-opt" onclick="selezionaTipo('CTA')">CTA (Angio Conservativa)</div>
        </div>
    </div>

    <div id="step-patient" class="card">
        <div class="grid-2">
            <div class="form-group">
                <label>Sesso</label>
                <select id="p-sesso">
                    <option value="M">Maschio</option>
                    <option value="F">Femmina</option>
                </select>
            </div>
            <div class="form-group">
                <label>Età</label>
                <input type="number" id="p-eta" placeholder="es. 45" oninput="calcolaAnno(this.value)">
            </div>
        </div>
        <div class="grid-2">
            <div class="form-group">
                <label>Peso (kg)</label>
                <input type="number" id="p-peso" placeholder="es. 75">
            </div>
            <div class="form-group">
                <label>Altezza (cm)</label>
                <input type="number" id="p-altezza" placeholder="es. 175">
            </div>
        </div>
        <div class="form-group">
            <label>Frequenza Cardiaca (bpm)</label>
            <input type="number" id="p-fc" placeholder="es. 72 (Opzionale)">
        </div>
        <button class="btn-action" onclick="avanzaAProtocollo()">Continua</button>
    </div>

    <div id="step-protocol" class="card">
        <div class="form-group">
            <label>Distretto Anatomico</label>
            <select id="p-distretto"></select>
        </div>
        <div class="form-group">
            <label>Concentrazione mdc (mgI/ml)</label>
            <select id="p-conc">
                <option value="400">400 mgI/ml</option>
                <option value="370" selected>370 mgI/ml</option>
                <option value="350">350 mgI/ml</option>
            </select>
        </div>
        <div class="form-group">
            <label>Tecnologia Acquisizione</label>
            <div class="btn-group">
                <div id="scan-sect" class="btn-opt" onclick="selezionaScan('SECT')">SECT</div>
                <div id="scan-dect" class="btn-opt" onclick="selezionaScan('DECT')">DECT</div>
            </div>
        </div>
        
        <div id="wrapper-dinamico" class="form-group"></div>

        <button class="btn-action" onclick="eseguiCalcoloottimizzato()">Elabora Piano di Carico</button>
    </div>

    <div id="step-results" class="card">
        <label style="color:var(--accent);">Parametri di Somministrazione</label>
        <div class="output-row"><span>Volume Contrasto:</span><span id="out-vol" class="output-val">-</span></div>
        <div class="output-row"><span>Flusso Consigliato:</span><span id="out-flusso" class="output-val">-</span></div>
        <div class="output-row"><span>Iodio Totale:</span><span id="out-iodio" class="output-val">-</span></div>
        <div class="output-row"><span>IDR Atteso:</span><span id="out-idr" class="output-val">-</span></div>
        <div class="output-row"><span>Lean Body Mass:</span><span id="out-lbw" class="output-val">-</span></div>
        <button class="btn-action" onclick="mostraRegistrazioneRoi()">Procedi a Validazione ROI</button>
    </div>

    <div id="step-roi" class="card">
        <label>Inserimento Output Valori di Densità (HU)</label>
        
        <div id="roi-body-group" style="display:none;" class="form-group">
            <div class="form-group" style="margin-bottom:8px;">
                <label>ROI Aorta</label>
                <input type="number" id="roi-aorta" placeholder="Valore HU">
            </div>
            <div class="grid-2" style="margin-bottom:8px;">
                <div class="form-group">
                    <label>Fegato Basale (M)</label>
                    <input type="number" id="roi-feg-bas-m" placeholder="Media HU">
                </div>
                <div class="form-group">
                    <label>Fegato Basale (SD)</label>
                    <input type="number" id="roi-feg-bas-sd" placeholder="Dev. Std">
                </div>
            </div>
            <div class="form-group">
                <label>ROI Fegato Portale</label>
                <input type="number" id="roi-feg-ven" placeholder="Valore HU">
            </div>
        </div>

        <div id="roi-cta-group" style="display:none;" class="form-group">
            <label>ROI Angio / Vaso Target</label>
            <input type="number" id="roi-vaso-cta" placeholder="Media HU nel distretto CTA">
        </div>

        <button id="btn-save" class="btn-action" onclick="inviaDatiDatabase()">Salva nel Database 💾</button>
    </div>

    <div class="biblio-section">
        <div class="biblio-title">Riferimenti Scientifici di Validazione</div>
        <div id="biblio-container"></div>
    </div>
</div>

<script src="config.js"></script>
<script>
    // Stato dell'applicazione
    let S = { tipoEsame: '', sesso: 'M', eta: 0, anno: 0, peso: 0, altezza: 0, fc: '', distretto: '', concentrazione: 370, scansione: 'SECT', ricostruzione: '', kv: '', volume: 0, flusso: 0, idr: 0, iodio: 0, lbw: 0 };

    const fontiBibliografiche = [
        "Clément O, et al. (ESUR Contrast Media Safety Committee). Contrast media safety: update on recent ESUR-Contrast Media Safety Committee publications. European Radiology, 2024. doi: 10.1007/s00330-024-10725-4 (linee guida internazionali — aggiornamento annuale)",
        "Gulizia M, Ding S, Sá Dos Reis C, Jaques C, Dromain C. Adjustments of iodinated contrast media using lean body weight for abdominopelvic computed tomography: a systematic review and meta-analysis. European Journal of Radiology, 2024;178:111631. doi: 10.1016/j.ejrad.2024.111631 (revisione sistematica e meta-analisi)",
        "Caruso D. Innovation and optimization of contrast media administration in computed tomography. Korean Journal of Radiology, 2025;26(3):210–212. doi: 10.3348/kjr.2024.1159 (revisione narrativa)",
        "Wang J, Duan X, Mahmood U, McKenney SE, Brady SL. An adult and pediatric size-based contrast administration reduction phantom study for single and dual-energy CT through preservation of contrast-to-noise ratio. Journal of Applied Clinical Medical Physics, 2024. doi: 10.1002/acm2.14340 (studio sperimentale su phantom — base fisica per gli sconti kV/keV)",
        "Raymakers D, Dubbeldam A, Coudyzer W, Bosmans H, Maleux G. Contrast volume for preoperative CT angiography of the aorta based on patient heart rate and body surface area: a pilot study. Journal of the Belgian Society of Radiology, 2019;103(1):57. doi: 10.5334/jbsr.1714 (studio prospettico)",
        "Dewilde M, Coudyzer W, Laenen A, Bosmans H, Maleux G. Patient-tailored contrast medium volume for preoperative computed tomography angiography of the aorta based on patient's heart rate and body surface area. Journal of the Belgian Society of Radiology, 2025. doi: 10.5334/jbsr.4033 (studio prospettico — follow-up del precedente con riduzione fino al 50%)"
    ];

    window.onload = function() {
        const container = document.getElementById('biblio-container');
        fontiBibliografiche.forEach(f => {
            let item = document.createElement('div');
            item.className = 'biblio-item';
            // Isola l'autore principale per dare lo stile standardizzato
            let primoPunto = f.indexOf('.');
            if(primoPunto !== -1){
                item.innerHTML = `<strong>${f.substring(0, primoPunto+1)}</strong>${f.substring(primoPunto+1)}`;
            } else {
                item.innerText = f;
            }
            container.appendChild(item);
        });
    };

    function calcolaAnno(eta) { S.anno = eta ? (2026 - parseInt(eta)) : 0; }

    function selezionaTipo(tipo) {
        S.tipoEsame = tipo;
        document.querySelectorAll('#step-type .btn-opt').forEach((b, idx) => {
            b.classList.toggle('selected', (idx === 0 && tipo === 'BODY') || (idx === 1 && tipo === 'CTA'));
        });
        
        // Popola i distretti in base alla scelta principale
        const distSelect = document.getElementById('p-distretto');
        distSelect.innerHTML = '';
        const lista = tipo === 'BODY' ? Object.keys(CONFIG.tilParametri) : Object.keys(CONFIG.ctaParametri);
        lista.forEach(d => { distSelect.innerHTML += `<option value="${d}">${d}</option>`; });

        switchCard('step-patient');
    }

    function switchCard(id) {
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function avanzaAProtocollo() {
        S.sesso = document.getElementById('p-sesso').value;
        S.eta = parseInt(document.getElementById('p-eta').value) || 0;
        S.peso = parseFloat(document.getElementById('p-peso').value) || 0;
        S.altezza = parseFloat(document.getElementById('p-altezza').value) || 0;
        S.fc = document.getElementById('p-fc').value ? parseInt(document.getElementById('p-fc').value) : '';

        if (!S.peso || !S.altezza || !S.eta) { alert("Compilare correttamente Peso, Altezza ed Età."); return; }
        
        // Calcolo preventivo LBW
        if (S.sesso === 'M') {
            S.lbw = (1.10 * S.peso) - 128 * Math.pow(S.peso / S.altezza, 2);
        } else {
            S.lbw = (1.07 * S.peso) - 148 * Math.pow(S.peso / S.altezza, 2);
        }

        selezionaScan('SECT'); // Default iniziale
        switchCard('step-protocol');
    }

    function selezionaScan(tech) {
        S.scansione = tech;
        document.getElementById('scan-sect').classList.toggle('selected', tech === 'SECT');
        document.getElementById('scan-dect').classList.toggle('selected', tech === 'DECT');

        const wrapper = document.getElementById('wrapper-dinamico');
        if (S.tipoEsame === 'BODY') {
            wrapper.innerHTML = `
                <label>Algoritmo Ricostruzione (BODY)</label>
                <div class="btn-group">
                    <div id="rec-hir" class="btn-opt" onclick="selezionaRic('Iterative')">Iterativa (HIR)</div>
                    <div id="rec-dlr" class="btn-opt" onclick="selezionaRic('DeepLearning')">Deep Learning (DLR)</div>
                </div>`;
            selezionaRic('Iterative');
        } else {
            // Se CTA, mostra i selettori di energia (kV o keV)
            if (tech === 'SECT') {
                wrapper.innerHTML = `
                    <label>Tensione di Tubo (kV)</label>
                    <div class="btn-group">
                        ${[120, 100, 80, 70].map(v => `<div id="kv-${v}" class="btn-opt" onclick="selezionaKvKey(${v})">${v} kV</div>`).join('')}
                    </div>`;
                selezionaKvKey(100);
            } else {
                wrapper.innerHTML = `
                    <label>Energia Monocromatica (keV)</label>
                    <div class="btn-group">
                        ${[140, 130, 120, 100, 70, 50, 40].map(v => `<div id="kv-${v}" class="btn-opt" onclick="selezionaKvKey(${v})">${v} keV</div>`).join('')}
                    </div>`;
                selezionaKvKey(70);
            }
            S.ricostruzione = ''; // Azzera ricostruzione per CTA
        }
    }

    function selezionaRic(ric) {
        S.ricostruzione = ric;
        document.getElementById('rec-hir')?.classList.toggle('selected', ric === 'Iterative');
        document.getElementById('rec-dlr')?.classList.toggle('selected', ric === 'DeepLearning');
    }

    function selezionaKvKey(val) {
        S.kv = val;
        document.querySelectorAll('#wrapper-dinamico .btn-opt').forEach(b => {
            b.classList.toggle('selected', b.id === `kv-${val}`);
        });
    }

    function eseguiCalcoloottimizzato() {
        S.distretto = document.getElementById('p-distretto').value;
        S.concentrazione = parseInt(document.getElementById('p-conc').value);

        if (S.tipoEsame === 'BODY') {
            let baseTil = CONFIG.tilParametri[S.distretto];
            let iodioCalcolato = (baseTil * S.lbw) / 1000;
            
            let stringaSconto = `${S.scansione}_${S.ricostruzione}`;
            let coeffSconto = CONFIG.scontiTecnologici[stringaSconto] || 1.0;
            iodioCalcolato *= coeffSconto;

            let volMdc = (iodioCalcolato * 1000) / S.concentrazione;

            if (S.fc !== '') {
                if (S.fc < 60) volMdc += CONFIG.correzioneFrequenza.sotto60;
                if (S.fc > 80) volMdc += CONFIG.correzioneFrequenza.sopra80;
            }

            S.volume = Math.round(volMdc);
            
            // Logica flussi standardizzata per peso su esami BODY
            if (S.peso < 60) S.flusso = 2.5;
            else if (S.peso >= 60 && S.peso < 80) S.flusso = 3.0;
            else if (S.peso >= 80 && S.peso < 100) S.flusso = 3.5;
            else S.flusso = 4.0;

            S.idr = S.flusso * (S.concentrazione / 1000);
            S.iodio = (S.volume * S.concentrazione) / 1000;

        } else {
            // Logica CTA Angiografica Conservativa
            let ctaParams = CONFIG.ctaParametri[S.distretto];
            let scontoEnergia = S.scansione === 'SECT' ? (CONFIG.scontiCtaSECT[S.kv] || 0) : (CONFIG.scontiCtaDECT[S.kv] || 0);
            
            let volCta = ctaParams.baseVol * (1 - scontoEnergia);
            if (volCta < ctaParams.floor) volCta = ctaParams.floor;
            
            S.volume = Math.round(volCta);
            S.idr = ctaParams.idrTarget;
            S.flusso = parseFloat((S.idr / (S.concentrazione / 1000)).toFixed(1));
            S.iodio = (S.volume * S.concentrazione) / 1000;
        }

        // Renderizzazione Outputs grafici
        document.getElementById('out-vol').innerText = `${S.volume} ml`;
        document.getElementById('out-flusso').innerText = `${S.flusso} ml/s`;
        document.getElementById('out-iodio').innerText = `${S.iodio.toFixed(1)} g`;
        document.getElementById('out-idr').innerText = `${S.idr.toFixed(2)} gI/s`;
        document.getElementById('out-lbw').innerText = `${S.lbw.toFixed(1)} kg`;

        switchCard('step-results');
    }

    function mostraRegistrazioneRoi() {
        if (S.tipoEsame === 'BODY') {
            document.getElementById('roi-body-group').style.display = 'block';
            document.getElementById('roi-cta-group').style.display = 'none';
        } else {
            document.getElementById('roi-body-group').style.display = 'none';
            document.getElementById('roi-cta-group').style.display = 'block';
        }
        switchCard('step-roi');
    }

    function inviaDatiDatabase() {
        let valAorta = document.getElementById('roi-aorta').value || "";
        let valFegBasM = document.getElementById('roi-feg-bas-m').value || "";
        let valFegBasSd = document.getElementById('roi-feg-bas-sd').value || "";
        let valFegVen = document.getElementById('roi-feg-ven').value || "";
        let valVasoCta = document.getElementById('roi-vaso-cta').value || "";

        let enhancementCalc = "";
        if (S.tipoEsame === "BODY" && valFegVen !== "" && valFegBasM !== "") {
            enhancementCalc = (parseFloat(valFegVen) - parseFloat(valFegBasM)).toFixed(1);
        }

        let payload = {
            dataEsame: new Date().toLocaleDateString('it-IT'),
            tipoEsame: S.tipoEsame,
            distretto: S.distretto,
            concentrazione: S.concentrazione,
            flusso: S.flusso,
            sesso: S.sesso,
            peso: S.peso,
            altezza: S.altezza,
            anno: S.anno,
            eta: S.eta,
            fc: S.fc || "N/A",
            scansione: S.scansione,
            ricostruzione: S.tipoEsame === "BODY" ? (S.ricostruzione === "Iterative" ? "HIR" : "DLR") : "",
            lbw: S.lbw.toFixed(1),
            volume: S.volume,
            idr: S.idr.toFixed(2),
            iodioTot: S.iodio.toFixed(1),
            roiAorta: valAorta,
            roiFegBasM: valFegBasM,
            roiFegBasSd: valFegBasSd,
            roiFegVen: valFegVen,
            enhancementFegato: enhancementCalc,
            huVasoTarget: valVasoCta
        };

        let btn = document.getElementById('btn-save');
        btn.innerText = "Sincronizzazione in corso...";
        btn.disabled = true;

        fetch(CONFIG.googleScriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            alert("Record clinico salvato correttamente nel Cloud.");
            location.reload();
        }).catch(() => {
            alert("Errore di trasmissione verso Google Fogli.");
            btn.innerText = "Salva nel Database 💾";
            btn.disabled = false;
        });
    }
</script>

</body>
</html>
